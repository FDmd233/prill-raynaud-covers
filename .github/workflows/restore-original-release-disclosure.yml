name: Restore original release disclosure

on:
  push:
    paths:
      - '.github/workflows/restore-original-release-disclosure.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.txt <<'EOF'
          A preprint constructing, for every smooth projective complex curve of genus at least two, a connected finite etale Galois cover whose every fibre divisor moves in a pencil. The proof combines Raynaud bundles, a determinant-normalised twist, finite monodromy, and the regular representation.

          Prepared with assistance from GPT-5.6 sol.
          EOF
          gh release edit v1.0.1-preprint --notes-file /tmp/notes.txt
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/restore-original-release-disclosure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary disclosure restore workflow'
          git push
